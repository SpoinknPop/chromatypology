<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum Personality Quiz</title>
    <style>
        /* CSS Variables for Clean Themes */
        :root {
            --bg-color: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.03);
            
            /* Likert Colors */
            --color-sd: #ef4444; /* Strongly Disagree (Red) */
            --color-d: #f97316;  /* Disagree (Orange) */
            --color-a: #06b6d4;  /* Agree (Teal) */
            --color-sa: #10b981; /* Strongly Agree (Green) */
        }

        /* Reset and Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.07) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: var(--text-primary);
        }

        /* Container Structure */
        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative !important;
                top: 0 !important;
            }
        }

        /* Light-mode Glass Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow);
        }

        /* Header Styling */
        .quiz-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quiz-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        /* Questions List */
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(241, 245, 249, 0.8);
            border-radius: 20px;
            padding: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.04);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .question-num {
            color: var(--text-secondary);
            font-weight: 500;
            margin-right: 6px;
        }

        /* Radial Options Container */
        .radial-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 550px;
            margin: 0 auto;
        }

        .option-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Styled Circle Buttons */
        .circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .circle-btn::after {
            content: '';
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0);
        }

        /* Option Label Text */
        .option-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            transition: color 0.2s ease;
            user-select: none;
        }

        /* Color States & Interactive Behaviours */
        
        /* 1. Strongly Disagree (Red) */
        .option-wrapper[data-val="1"]:hover .circle-btn {
            border-color: var(--color-sd);
            box-shadow: 0 0 12px rgba(239, 110, 110, 0.2);
        }
        .option-wrapper[data-val="1"].selected .circle-btn {
            border-color: var(--color-sd);
            background: rgba(239, 68, 68, 0.05);
        }
        .option-wrapper[data-val="1"].selected .circle-btn::after {
            background: var(--color-sd);
            transform: scale(1);
        }
        .option-wrapper[data-val="1"].selected .option-label {
            color: var(--color-sd);
        }

        /* 2. Disagree (Orange) */
        .option-wrapper[data-val="2"]:hover .circle-btn {
            border-color: var(--color-d);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.2);
        }
        .option-wrapper[data-val="2"].selected .circle-btn {
            border-color: var(--color-d);
            background: rgba(249, 115, 22, 0.05);
        }
        .option-wrapper[data-val="2"].selected .circle-btn::after {
            background: var(--color-d);
            transform: scale(1);
        }
        .option-wrapper[data-val="2"].selected .option-label {
            color: var(--color-d);
        }

        /* 3. Agree (Teal) */
        .option-wrapper[data-val="3"]:hover .circle-btn {
            border-color: var(--color-a);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }
        .option-wrapper[data-val="3"].selected .circle-btn {
            border-color: var(--color-a);
            background: rgba(6, 182, 212, 0.05);
        }
        .option-wrapper[data-val="3"].selected .circle-btn::after {
            background: var(--color-a);
            transform: scale(1);
        }
        .option-wrapper[data-val="3"].selected .option-label {
            color: var(--color-a);
        }

        /* 4. Strongly Agree (Green) */
        .option-wrapper[data-val="4"]:hover .circle-btn {
            border-color: var(--color-sa);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }
        .option-wrapper[data-val="4"].selected .circle-btn {
            border-color: var(--color-sa);
            background: rgba(16, 185, 129, 0.05);
        }
        .option-wrapper[data-val="4"].selected .circle-btn::after {
            background: var(--color-sa);
            transform: scale(1);
        }
        .option-wrapper[data-val="4"].selected .option-label {
            color: var(--color-sa);
        }

        /* Sticky Sidebar Results */
        .sidebar {
            position: sticky;
            top: 40px;
        }

        .results-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            padding-bottom: 12px;
        }

        .trait-container {
            margin-bottom: 20px;
        }

        .trait-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .bar-bg {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 50%; /* Starts at neutral 50% midpoint */
            border-radius: 5px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        /* Custom dynamic gradient bars to pop off the white surface */
        #e-i-fill { background: linear-gradient(90deg, #f43f5e, #fb7185); }
        #s-n-fill { background: linear-gradient(90deg, #0ea5e9, #38bdf8); }
        #t-f-fill { background: linear-gradient(90deg, #ec4899, #f472b6); }
        #j-p-fill { background: linear-gradient(90deg, #10b981, #34d399); }

        /* Completion & Counter Badge */
        .status-badge {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(241, 245, 249, 0.6);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: List of Questions -->
        <div class="glass-panel">
            <div class="quiz-header">
                <h1>Spectrum Analysis</h1>
                <p>Please review each statement below and indicate your preference using the options provided. Your metrics will balance and shift live.</p>
            </div>

            <div class="questions-list" id="quiz-container">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- Right Side: Sticky Live Metrics Sidebar -->
        <div class="glass-panel sidebar">
            <h2 class="results-title">Live Personality Dynamics</h2>
            
            <div class="trait-container">
                <div class="trait-labels"><span>Introversion</span><span>Extroversion</span></div>
                <div class="bar-bg"><div id="e-i-fill" class="bar-fill"></div></div>
            </div>

            <div class="trait-container">
                <div class="trait-labels"><span>Sensing</span><span>Intuition</span></div>
                <div class="bar-bg"><div id="s-n-fill" class="bar-fill"></div></div>
            </div>

            <div class="trait-container">
                <div class="trait-labels"><span>Thinking</span><span>Feeling</span></div>
                <div class="bar-bg"><div id="t-f-fill" class="bar-fill"></div></div>
            </div>

            <div class="trait-container">
                <div class="trait-labels"><span>Judging</span><span>Perceiving</span></div>
                <div class="bar-bg"><div id="j-p-fill" class="bar-fill"></div></div>
            </div>

            <div class="status-badge" id="status-badge">
                0 of 10 statements answered.
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { id: 0, text: "You feel completely energized after a crowded social mixer.", trait: "EI" },
            { id: 1, text: "You look at physical facts rather than searching for hidden meanings.", trait: "SN", reverse: true },
            { id: 2, text: "Objective logic should take precedence over mercy and sentimentality.", trait: "TF", reverse: true },
            { id: 3, text: "You feel most creative when following a highly structured daily routine.", trait: "JP", reverse: true },
            { id: 4, text: "You find yourself readily striking up conversations with stranger open-heartedly.", trait: "EI" },
            { id: 5, text: "You operate beautifully in chaotic environments relying on spontaneous inspiration.", trait: "JP" },
            { id: 6, text: "You absorb the ambient mood and emotions of whatever room you enter.", trait: "TF" },
            { id: 7, text: "You naturally lean toward symbols, metaphors, and conceptual philosophies.", trait: "SN" },
            { id: 8, text: "You actively seek solo time to recharge after dealing with heavy tasks.", trait: "EI", reverse: true },
            { id: 9, text: "An unstructured schedule makes you feel completely lost and stressed.", trait: "JP", reverse: true }
        ];

        // Track user answers (questionIndex -> numeric choice 1 to 4)
        let answers = {};

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="question-text">
                        <span class="question-num">${String(index + 1).padStart(2, '0')}.</span>
                        <span>${q.text}</span>
                    </div>
                    <div class="radial-options">
                        <div class="option-wrapper" data-q="${index}" data-val="1">
                            <div class="circle-btn"></div>
                            <span class="option-label">Strongly<br>Disagree</span>
                        </div>
                        <div class="option-wrapper" data-q="${index}" data-val="2">
                            <div class="circle-btn"></div>
                            <span class="option-label">Disagree</span>
                        </div>
                        <div class="option-wrapper" data-q="${index}" data-val="3">
                            <div class="circle-btn"></div>
                            <span class="option-label">Agree</span>
                        </div>
                        <div class="option-wrapper" data-q="${index}" data-val="4">
                            <div class="circle-btn"></div>
                            <span class="option-label">Strongly<br>Agree</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Handle clicking the custom radial options
            document.querySelectorAll('.option-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', function() {
                    const qIdx = parseInt(this.getAttribute('data-q'));
                    const val = parseInt(this.getAttribute('data-val'));
                    
                    // Clear previous selection in this specific question block
                    const siblings = this.parentElement.querySelectorAll('.option-wrapper');
                    siblings.forEach(node => node.classList.remove('selected'));
                    
                    // Style current choice
                    this.classList.add('selected');
                    
                    // Save and trigger calculations
                    answers[qIdx] = val;
                    updateMetrics();
                });
            });
        }

        function updateMetrics() {
            let traits = { 
                EI: { score: 0, count: 0 }, 
                SN: { score: 0, count: 0 }, 
                TF: { score: 0, count: 0 }, 
                JP: { score: 0, count: 0 } 
            };

            // Calculate current scores
            Object.keys(answers).forEach(qIdxStr => {
                const qIdx = parseInt(qIdxStr);
                const val = answers[qIdx];
                const q = questions[qIdx];
                
                // Shift 1-4 option value down to a relative balance window (-1.5 to +1.5)
                let balanceValue = val - 2.5;
                if (q.reverse) {
                    balanceValue = -balanceValue;
                }

                traits[q.trait].score += balanceValue;
                traits[q.trait].count++;
            });

            // Update DOM progress widths smoothly
            adjustBarWidth("e-i-fill", traits.EI);
            adjustBarWidth("s-n-fill", traits.SN);
            adjustBarWidth("t-f-fill", traits.TF);
            adjustBarWidth("j-p-fill", traits.JP);

            // Update user status copy
            const answeredCount = Object.keys(answers).length;
            const badge = document.getElementById('status-badge');
            if (answeredCount === questions.length) {
                badge.innerHTML = "✨ <strong>Evaluation Complete!</strong> Dynamics locked.";
                badge.style.background = "rgba(16, 185, 129, 0.1)";
                badge.style.color = "var(--color-sa)";
                badge.style.borderColor = "rgba(16, 185, 129, 0.3)";
            } else {
                badge.innerHTML = `<strong>${answeredCount} of ${questions.length}</strong> statements answered.`;
                badge.style.background = "rgba(241, 245, 249, 0.6)";
                badge.style.color = "var(--text-secondary)";
                badge.style.borderColor = "rgba(226, 232, 240, 0.5)";
            }
        }

        function adjustBarWidth(elementId, traitData) {
            const bar = document.getElementById(elementId);
            if (traitData.count === 0) {
                bar.style.width = "50%"; // Centered fallback
                return;
            }

            const average = traitData.score / traitData.count;
            // Map the balance accurately over visual scale widths (min 10% to max 90%)
            let targetPercentage = 50 + (average / 1.5) * 40;
            bar.style.width = `${targetPercentage}%`;
        }

        // Initialize App
        renderQuiz();
    </script>
</body>
</html>
