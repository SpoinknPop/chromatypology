<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Glassmorphism Personality Quiz</title>
    <style>
        /* Reset and Animated Rainbow Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #ff0055, #00ff66, #00ffff, #ff00ff, #ffcc00);
            background-size: 400% 400%;
            animation: rainbowBg 20s ease infinite;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        @keyframes rainbowBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main Layout Container */
        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .results-sidebar {
                position: relative !important;
                top: 0 !important;
            }
        }

        /* Glassmorphism Panel Base */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Quiz Header */
        .quiz-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .quiz-header p {
            opacity: 0.9;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* Questions List */
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .question-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .question-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .question-num {
            opacity: 0.7;
        }

        /* Horizontal 4-Point Likert Scale */
        .likert-scale {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 500px) {
            .likert-scale {
                grid-template-columns: 1fr;
            }
        }

        /* Color-Coded Likert Buttons */
        .likert-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            padding: 12px 8px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
        }

        /* Distinct Color-Coded Hover Borders and Selected States */
        /* SD: Red | D: Orange | A: Light Green | SA: Bright Green */
        .likert-btn[data-value="1"]:hover { border-color: #ff4d4d; background: rgba(255, 77, 77, 0.2); }
        .likert-btn[data-value="1"].selected { background: #ff4d4d; box-shadow: 0 0 15px rgba(255, 77, 77, 0.5); }

        .likert-btn[data-value="2"]:hover { border-color: #ff9f43; background: rgba(255, 159, 67, 0.2); }
        .likert-btn[data-value="2"].selected { background: #ff9f43; box-shadow: 0 0 15px rgba(255, 159, 67, 0.5); }

        .likert-btn[data-value="3"]:hover { border-color: #00d2d3; background: rgba(0, 210, 211, 0.2); }
        .likert-btn[data-value="3"].selected { background: #00d2d3; box-shadow: 0 0 15px rgba(0, 210, 211, 0.5); }

        .likert-btn[data-value="4"]:hover { border-color: #1dd1a1; background: rgba(29, 209, 161, 0.2); }
        .likert-btn[data-value="4"].selected { background: #1dd1a1; box-shadow: 0 0 15px rgba(29, 209, 161, 0.5); }

        /* Sticky Live Results Sidebar */
        .results-sidebar {
            position: sticky;
            top: 40px;
        }

        .results-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            font-weight: 700;
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .trait-container {
            margin-bottom: 22px;
        }

        .trait-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .trait-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .trait-bar-fill {
            height: 100%;
            width: 50%; /* Default middle ground */
            border-radius: 7px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Rainbow spectrum assignments for the dynamic result bars */
        #e-i-fill { background: linear-gradient(90deg, #ff0055, #ff5000); }
        #s-n-fill { background: linear-gradient(90deg, #ffcc00, #00ff66); }
        #t-f-fill { background: linear-gradient(90deg, #00ff66, #00ffff); }
        #j-p-fill { background: linear-gradient(90deg, #00ffff, #ff00ff); }

        .status-panel {
            margin-top: 25px;
            text-align: center;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            <div class="quiz-header">
                <h1>Spectrum Assessment</h1>
                <p>Scroll through and answer the statements below to watch your profile calculate live.</p>
            </div>

            <div class="questions-list" id="quiz-container">
                </div>
        </div>

        <div class="glass-panel results-sidebar">
            <h2 class="results-title">Live Rainbow Metrics</h2>
            
            <div class="trait-container">
                <div class="trait-info"><span>Introversion</span><span>Extroversion</span></div>
                <div class="trait-bar-bg"><div id="e-i-fill" class="trait-bar-fill"></div></div>
            </div>

            <div class="trait-container">
                <div class="trait-info"><span>Sensing</span><span>Intuition</span></div>
                <div class="trait-bar-bg"><div id="s-n-fill" class="trait-bar-fill"></div></div>
            </div>

            <div class="trait-container">
                <div class="trait-info"><span>Thinking</span><span>Feeling</span></div>
                <div class="trait-bar-bg"><div id="t-f-fill" class="trait-bar-fill"></div></div>
            </div>

            <div class="trait-container">
                <div class="trait-info"><span>Judging</span><span>Perceiving</span></div>
                <div class="trait-bar-bg"><div id="j-p-fill" class="trait-bar-fill"></div></div>
            </div>

            <div class="status-panel" id="status-text">
                0 of 10 statements answered.
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { id: 0, text: "You feel completely energized after a crowded social mixer.", trait: "EI" },
            { id: 1, text: "You look at physical facts rather than searching for hidden meanings.", trait: "SN", reverse: true },
            { id: 2, text: "Objective logic should take precedence over mercy and sentimentality.", trait: "TF", reverse: true },
            { id: 3, text: "You feel most creative when following a highly structured daily routine.", trait: "JP", reverse: true },
            { id: 4, text: "You find yourself readily striking up conversations with stranger open-heartedly.", trait: "EI" },
            { id: 5, text: "You operate beautifully in chaotic environments relying on spontaneous inspiration.", trait: "JP" },
            { id: 6, text: "You absorb the ambient mood and emotions of whatever room you enter.", trait: "TF" },
            { id: 7, text: "You naturally lean toward symbols, metaphors, and conceptual philosophies.", trait: "SN" },
            { id: 8, text: "You actively seek solo time to recharge after dealing with heavy tasks.", trait: "EI", reverse: true },
            { id: 9, text: "An unstructured schedule makes you feel completely lost and stressed.", trait: "JP", reverse: true }
        ];

        // Track answers: key is question index, value is 1 through 4
        let answers = {};

        function buildQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'question-item';
                item.innerHTML = `
                    <div class="question-text">
                        <span class="question-num">${index + 1}.</span>
                        <span>${q.text}</span>
                    </div>
                    <div class="likert-scale">
                        <button class="likert-btn" data-q="${index}" data-value="1">Strongly Disagree</button>
                        <button class="likert-btn" data-q="${index}" data-value="2">Disagree</button>
                        <button class="likert-btn" data-q="${index}" data-value="3">Agree</button>
                        <button class="likert-btn" data-q="${index}" data-value="4">Strongly Agree</button>
                    </div>
                `;
                container.appendChild(item);
            });

            // Set up click listeners for all scale options
            document.querySelectorAll('.likert-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const qIndex = parseInt(this.getAttribute('data-q'));
                    const val = parseInt(this.getAttribute('data-value'));
                    
                    handleSelection(qIndex, val, this);
                });
            });
        }

        function handleSelection(qIndex, val, clickedBtn) {
            answers[qIndex] = val;

            // Clear active selection states within this specific question block
            const siblings = clickedBtn.parentElement.querySelectorAll('.likert-btn');
            siblings.forEach(btn => btn.classList.remove('selected'));
            
            // Activate selected option style
            clickedBtn.classList.add('selected');

            // Instantly compute results and trigger spring animations
            updateLiveMetrics();
        }

        function updateLiveMetrics() {
            let traits = { 
                EI: { score: 0, count: 0 }, 
                SN: { score: 0, count: 0 }, 
                TF: { score: 0, count: 0 }, 
                JP: { score: 0, count: 0 } 
            };

            // Calculate current profile weight balances
            Object.keys(answers).forEach(qIdxStr => {
                const qIdx = parseInt(qIdxStr);
                const val = answers[qIdx];
                const q = questions[qIdx];
                
                // Shift 1-4 option value down to a neutral relative balance window (-1.5 to +1.5)
                let balanceValue = val - 2.5;
                if (q.reverse) {
                    balanceValue = -balanceValue;
                }

                traits[q.trait].score += balanceValue;
                traits[q.trait].count++;
            });

            // Update DOM progress bars widths based on balances
            animateBar("e-i-fill", traits.EI);
            animateBar("s-n-fill", traits.SN);
            animateBar("t-f-fill", traits.TF);
            animateBar("j-p-fill", traits.JP);

            // Update user response status copy block
            const answeredCount = Object.keys(answers).length;
            const statusBox = document.getElementById('status-text');
            if (answeredCount === questions.length) {
                statusBox.innerHTML = "🌈 <strong>Profile Completed!</strong> Your matches are locked.";
                statusBox.style.background = "rgba(0, 255, 100, 0.25)";
            } else {
                statusBox.innerHTML = `<strong>${answeredCount} of ${questions.length}</strong> statements answered.`;
                statusBox.style.background = "rgba(0,0,0,0.15)";
            }
        }

        function animateBar(elementId, traitData) {
            const bar = document.getElementById(elementId);
            if (traitData.count === 0) {
                bar.style.width = "50%"; // Keep balanced perfectly centered until option is chosen
                return;
            }

            const average = traitData.score / traitData.count;
            // Map the balance accurately over visual scale widths (min 12% to max 88%)
            let targetPercentage = 50 + (average / 1.5) * 38;
            bar.style.width = `${targetPercentage}%`;
        }

        // Run application setup on window load
        buildQuiz();
    </script>
</body>
</html>
