<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Personality Quiz</title>
    <style>
        /* Reset and Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Decorative background blobs for enhanced glass effect */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
        }
        .blob-1 { top: 10%; left: 10%; background: #ff007f; opacity: 0.3; }
        .blob-2 { bottom: 10%; right: 10%; background: #00f0ff; opacity: 0.3; }

        /* Main Glass Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            color: #fff;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Quiz Section */
        .quiz-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-text {
            font-size: 0.9rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            transition: width 0.4s ease;
        }

        .question-card {
            min-height: 120px;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.5;
            font-weight: 500;
        }

        /* 4-Point Likert Scale Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: rgba(255, 255, 255, 0.3);
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Navigation Buttons */
        .nav-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Live Results Section */
        .results-section {
            background: rgba(255, 255, 255, 0.03);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .results-section {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding-left: 0;
                padding-top: 40px;
            }
        }

        .results-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            font-weight: 500;
            text-align: center;
        }

        .trait-container {
            margin-bottom: 20px;
        }

        .trait-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .trait-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .trait-bar-fill {
            height: 100%;
            width: 50%; /* Default midpoint */
            border-radius: 6px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.6s ease;
        }

        /* Trait Custom Colors */
        #e-i-fill { background: linear-gradient(90deg, #ff4e50, #f9d423); }
        #s-n-fill { background: linear-gradient(90deg, #00c6ff, #0072ff); }
        #t-f-fill { background: linear-gradient(90deg, #f857a6, #ff5858); }
        #j-p-fill { background: linear-gradient(90deg, #11998e, #38ef7d); }

        .completion-msg {
            text-align: center;
            font-style: italic;
            opacity: 0.7;
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="quiz-section">
            <div>
                <h1>Spectrum Quiz</h1>
                <div class="progress-container">
                    <div class="progress-text" id="progress-text">Question 1 of 10</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="question-card">
                    <p class="question-text" id="question-text">Loading question...</p>
                </div>

                <div class="options-container">
                    <button class="option-btn" data-weight="1" onclick="selectOption(1)">Strongly Disagree</button>
                    <button class="option-btn" data-weight="2" onclick="selectOption(2)">Disagree</button>
                    <button class="option-btn" data-weight="3" onclick="selectOption(3)">Agree</button>
                    <button class="option-btn" data-weight="4" onclick="selectOption(4)">Strongly Agree</button>
                </div>
            </div>

            <div class="nav-actions">
                <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
                <button class="nav-btn" id="next-btn" onclick="navigate(1)" disabled>Next</button>
            </div>
        </div>

        <div class="results-section">
            <h2 class="results-title">Live Personality Dynamics</h2>
            
            <div class="trait-container">
                <div class="trait-info">
                    <span>Introversion (I)</span>
                    <span>Extroversion (E)</span>
                </div>
                <div class="trait-bar-bg">
                    <div id="e-i-fill" class="trait-bar-fill"></div>
                </div>
            </div>

            <div class="trait-container">
                <div class="trait-info">
                    <span>Sensing (S)</span>
                    <span>Intuition (N)</span>
                </div>
                <div class="trait-bar-bg">
                    <div id="s-n-fill" class="trait-bar-fill"></div>
                </div>
            </div>

            <div class="trait-container">
                <div class="trait-info">
                    <span>Thinking (T)</span>
                    <span>Feeling (F)</span>
                </div>
                <div class="trait-bar-bg">
                    <div id="t-f-fill" class="trait-bar-fill"></div>
                </div>
            </div>

            <div class="trait-container">
                <div class="trait-info">
                    <span>Judging (J)</span>
                    <span>Perceiving (P)</span>
                </div>
                <div class="trait-bar-bg">
                    <div id="j-p-fill" class="trait-bar-fill"></div>
                </div>
            </div>

            <p class="completion-msg" id="status-msg">Answer questions to watch your metrics shift live.</p>
        </div>
    </div>

    <script>
        // 10 Sample Questions mapping to classic personality dynamics
        const questions = [
            { id: 0, text: "You feel energized after spending time with a large group of active people.", trait: "EI" },
            { id: 1, text: "You prefer focusing on concrete facts rather than abstract, speculative theories.", trait: "SN", reverse: true },
            { id: 2, text: "When making tough decisions, logic should always override emotional considerations.", trait: "TF", reverse: true },
            { id: 3, text: "You prefer having a firm, structured travel itinerary over 'winging it'.", trait: "JP", reverse: true },
            { id: 4, text: "You frequently initiate conversations with strangers in public settings.", trait: "EI" },
            { id: 5, text: "You heavily rely on bursts of creative inspiration rather than organized routines.", trait: "JP" },
            { id: 6, text: "You find yourself deeply emphasizing with characters' feelings when watching films.", trait: "TF" },
            { id: 7, text: "You are drawn to creative writing, metaphors, and symbols over technical readouts.", trait: "SN" },
            { id: 8, text: "You feel perfectly comfortable blending into the background at social gatherings.", trait: "EI", reverse: true },
            { id: 9, text: "A cluttered desk makes you feel stressed and deeply unorganized.", trait: "JP", reverse: true }
        ];

        let currentIndex = 0;
        // Array tracking user answers: null means unanswered, values 1 through 4 represent choices
        let answers = Array(questions.length).fill(null);

        function initQuiz() {
            renderQuestion();
            updateResults();
        }

        function renderQuestion() {
            const currentQ = questions[currentIndex];
            document.getElementById("question-text").innerText = currentQ.text;
            document.getElementById("progress-text").innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            
            // Update Progress Bar fill percent
            const progressPercent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById("progress-fill").style.width = `${progressPercent}%`;

            // Reset selected states on options
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => {
                btn.classList.remove("selected");
                if (parseInt(btn.getAttribute("data-weight")) === answers[currentIndex]) {
                    btn.classList.add("selected");
                }
            });

            // Toggle Navigation Button States
            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").disabled = answers[currentIndex] === null || currentIndex === questions.length - 1;
        }

        function selectOption(weight) {
            answers[currentIndex] = weight;
            
            // UI visual update for choice Selection
            const buttons = document.querySelectorAll(".option-btn");
            buttons.forEach(btn => btn.classList.remove("selected"));
            buttons[weight - 1].classList.add("selected");

            // Allow moving forward
            document.getElementById("next-btn").disabled = currentIndex === questions.length - 1;

            // Instantly calculate and animate results live
            updateResults();

            // Autonavigate to next question after a micro-delay for smooth UX
            if (currentIndex < questions.length - 1) {
                setTimeout(() => {
                    navigate(1);
                }, 250);
            }
        }

        function navigate(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= questions.length) currentIndex = questions.length - 1;
            renderQuestion();
        }

        function updateResults() {
            // Baselines (Values sit neatly at 50% midpoint if no data exists)
            let traits = { EI: { score: 0, count: 0 }, SN: { score: 0, count: 0 }, TF: { score: 0, count: 0 }, JP: { score: 0, count: 0 } };

            answers.forEach((ans, idx) => {
                if (ans !== null) {
                    const q = questions[idx];
                    // Convert 1-4 scale down to a normalized normalized numeric scale (-1.5 to +1.5)
                    let scoreValue = ans - 2.5; 
                    
                    if (q.reverse) {
                        scoreValue = -scoreValue;
                    }

                    traits[q.trait].score += scoreValue;
                    traits[q.trait].count++;
                }
            });

            // Update DOM element positions dynamically via inline widths
            updateBar("e-i-fill", traits.EI);
            updateBar("s-n-fill", traits.SN);
            updateBar("t-f-fill", traits.TF);
            updateBar("j-p-fill", traits.JP);

            // Conditional status completion text adjustments
            const answersCount = answers.filter(a => a !== null).length;
            const statusMsg = document.getElementById("status-msg");
            if (answersCount === questions.length) {
                statusMsg.innerText = "Quiz Complete! Your dynamic profile is locked in.";
                statusMsg.style.color = "#38ef7d";
            } else if (answersCount > 0) {
                statusMsg.innerText = `Analyzing traits... (${answersCount}/${questions.length} completed)`;
                statusMsg.style.color = "#fff";
            }
        }

        function updateBar(elementId, traitData) {
            const bar = document.getElementById(elementId);
            if (traitData.count === 0) {
                bar.style.width = "50%"; // Center standard
                return;
            }
            
            // Calculate average offset value (-1.5 max left to +1.5 max right)
            const avg = traitData.score / traitData.count;
            // Map to percentage width string cleanly (min 10%, max 90%)
            let percentage = 50 + (avg / 1.5) * 40; 
            bar.style.width = `${percentage}%`;
        }

        // Initialize App Loop
        initQuiz();
    </script>
</body>
</html>
